<style>
:root{
  --bg:#0b0f17;--panel:rgba(14,19,30,.86);--panel-solid:#0f1522;--ink:#eef2f7;--muted:#9aa6b8;--line:rgba(255,255,255,.09);
  --chip:#182133;--accent:#ff4d6d;--glow:0 0 0 1px rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.45);
}
:root[data-theme="light"]{--bg:#eef1f5;--panel:rgba(255,255,255,.9);--panel-solid:#fff;--ink:#111827;--muted:#5b6474;--line:rgba(0,0,0,.08);--chip:#eef1f6;--glow:0 10px 30px rgba(15,23,42,.15)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#bbb!important;font-size:10px}
.leaflet-control-attribution a{color:#ddd!important}
:root[data-theme="light"] .leaflet-control-attribution{background:rgba(255,255,255,.7)!important;color:#444!important}
:root[data-theme="light"] .leaflet-control-attribution a{color:#222!important}

/* panel */
.panel{position:fixed;z-index:500;left:16px;top:16px;bottom:16px;width:400px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:22px;box-shadow:var(--glow);overflow:hidden}
.head{padding:18px 18px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.top a{color:var(--muted);text-decoration:none}
.top a:hover{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;height:32px;min-width:32px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
h1{font-size:30px;line-height:1;margin:12px 0 4px;font-weight:800;letter-spacing:-.02em}
h1 .jp{font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:15px;color:var(--accent);margin-left:6px;letter-spacing:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.region{display:flex;gap:6px;margin-top:12px}
.region button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.region button[aria-pressed="true"]{background:var(--ink);color:var(--panel-solid)}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.day i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c);box-shadow:0 0 10px var(--c)}
.day[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.day[aria-pressed="true"] i{background:#fff}
.body{overflow-y:auto;padding:14px 18px 18px;flex:1}
.dayhead{margin-bottom:10px}
.dayhead .when{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.dayhead h2{margin:4px 0 4px;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.dayhead p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.stops{list-style:none;margin:12px 0 0;padding:0;position:relative}
.stops:before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--c),transparent);opacity:.5}
.stop{position:relative;display:grid;grid-template-columns:32px 1fr;gap:10px;padding:8px 6px 10px 0;border-radius:12px;cursor:pointer}
.stop:hover,.stop.on{background:color-mix(in srgb,var(--c) 12%,transparent)}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--c);box-shadow:0 0 0 3px var(--panel-solid),0 0 14px var(--c);z-index:1}
.stop h3{margin:2px 0 2px;font-size:15.5px;font-weight:700;line-height:1.25}
.stop .t{font-size:12px;color:var(--muted);font-weight:700;margin-right:6px}
.stop p{margin:2px 0 4px;font-size:13.5px;color:var(--muted);line-height:1.4}
.who{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--ink);margin-right:4px}
.nav{font-size:12.5px;font-weight:700;color:var(--c);text-decoration:none}
.tip{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13px;color:var(--muted);line-height:1.45}
.tip b{color:var(--ink)}
.foot{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot button,.foot a{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
.foot small{color:var(--muted);font-size:11px;width:100%}

/* markers */
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px/1 "Bricolage Grotesque",sans-serif;background:var(--c);border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 0 22px var(--c);transition:transform .2s}
.pin.dim{opacity:.35;transform:scale(.7);box-shadow:none}
.pin.hot{transform:scale(1.25)}
.home{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#111;border:2px solid #ffd166;box-shadow:0 0 0 0 rgba(255,209,102,.7);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.6)}70%{box-shadow:0 0 0 18px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
.route{stroke-dasharray:10 12;animation:flow 1.4s linear infinite;filter:drop-shadow(0 0 6px currentColor)}
@keyframes flow{to{stroke-dashoffset:-22}}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--ink);border-radius:14px;box-shadow:var(--glow)}
.leaflet-popup-tip{background:var(--panel-solid)}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.4}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content a{color:var(--accent);font-weight:700}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}

/* mobile: bottom sheet */
.grab{display:none}
@media (max-width:760px){
  .panel{left:0;right:0;bottom:0;top:auto;width:auto;height:56vh;border-radius:22px 22px 0 0;transition:height .25s}
  .panel.big{height:86vh}
  .panel.small{height:150px}
  .grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--muted);opacity:.5;margin:8px auto 0;cursor:pointer}
  .head{padding:8px 16px 6px}
  h1{font-size:22px;margin:6px 0 2px}
  .sub{font-size:13px}
  .region{margin-top:8px}
  .days{padding:8px 16px}
  .body{padding:10px 16px 16px}
  .sub{display:none}
  .top{font-size:12px}
  .region button{padding:6px 8px;font-size:13px}
  .foot{padding:8px 12px;flex-wrap:nowrap;overflow-x:auto}
  .foot button,.foot a{white-space:nowrap;padding:6px 9px;font-size:12px}
  .foot small{display:none}
  .leaflet-top.leaflet-right{top:0}
}
@media (prefers-reduced-motion:reduce){.route,.home{animation:none}}
</style>
</head>

// ---------- MAPA ----------
var root=document.documentElement;
var light=false; try{light=localStorage.getItem('wl-map-theme')==='light'}catch(e){}
var TILES={dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',light:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png'};
var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([35.69,139.75],12);
L.control.zoom({position:'topright'}).addTo(map);
var tiles=L.tileLayer(light?TILES.light:TILES.dark,{maxZoom:19,subdomains:'abcd',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
if(light) root.setAttribute('data-theme','light');
document.getElementById('theme').onclick=function(){light=!light;tiles.setUrl(light?TILES.light:TILES.dark);if(light)root.setAttribute('data-theme','light');else root.removeAttribute('data-theme');try{localStorage.setItem('wl-map-theme',light?'light':'dark')}catch(e){}};

var layer=L.layerGroup().addTo(map), homeLayer=L.layerGroup().addTo(map);
var region='tokio', current=null, markers=[];
var panel=document.getElementById('panel');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function gm(s){return 'https://www.google.com/maps/search/?api=1&query='+s.ll[0]+','+s.ll[1]}
function pinIcon(i,c,dim){return L.divIcon({className:'',html:'<div class="pin'+(dim?' dim':'')+'" style="--c:'+c+'">'+i+'</div>',iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14]})}

function renderRegion(r){
  region=r; var R=D[r];
  document.querySelectorAll('.region button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.r===r)});
  document.getElementById('title').innerHTML=R.title;
  document.getElementById('subtitle').textContent=R.sub;
  var dd=document.getElementById('days'); dd.innerHTML='';
  var all=document.createElement('button');all.type='button';all.className='day';all.style.setProperty('--c','#ff4d6d');all.dataset.id='all';all.innerHTML='<i></i>Wszystko';dd.appendChild(all);
  R.days.forEach(function(d){var b=document.createElement('button');b.type='button';b.className='day';b.style.setProperty('--c',d.c);b.dataset.id=d.id;b.innerHTML='<i></i>'+esc(d.lbl);dd.appendChild(b)});
  dd.onclick=function(e){var b=e.target.closest('.day');if(b)select(b.dataset.id,true)};
  homeLayer.clearLayers();
  L.marker(R.home.ll,{icon:L.divIcon({className:'',html:'<div class="home">🏨</div>',iconSize:[42,42],iconAnchor:[21,21],popupAnchor:[0,-20]}),zIndexOffset:1000})
   .bindPopup('<b>'+esc(R.home.n)+'</b><br>'+esc(R.home.d)+'<br><a href="'+gm(R.home)+'" target="_blank" rel="noopener">nawiguj ↗</a>').addTo(homeLayer);
  select('all',true);
}

function select(id,fly){
  current=id; var R=D[region];
  document.querySelectorAll('#days .day').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.id===id)});
  var act=document.querySelector('#days .day[aria-pressed="true"]'); if(act&&act.scrollIntoView) act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  layer.clearLayers(); markers=[];
  var bounds=[R.home.ll], body=document.getElementById('body');
  var list=id==='all'?R.days:R.days.filter(function(d){return d.id===id});
  list.forEach(function(d){
    if(id==='all' && d.id==='9f') return; // Fuji tylko po wybraniu
    var pts=[R.home.ll].concat(d.stops.map(function(s){return s.ll}));
    if(d.stops.length) L.polyline(pts,{color:d.c,weight:id==='all'?3:4.5,opacity:id==='all'?.55:.95,className:'route'}).addTo(layer);
    d.stops.forEach(function(s,i){
      var m=L.marker(s.ll,{icon:pinIcon(i+1,d.c,false),riseOnHover:true})
        .bindPopup('<b>'+esc(s.n)+'</b><br><small>'+esc(d.lbl)+(s.t?' · '+esc(s.t):'')+'</small><br>'+esc(s.d)+'<br><a href="'+gm(s)+'" target="_blank" rel="noopener">nawiguj ↗</a>').addTo(layer);
      m._k=d.id+'-'+i; markers.push(m); bounds.push(s.ll);
    });
  });
  // panel
  var html='';
  if(id==='all'){
    html+='<div class="dayhead" style="--c:#ff4d6d"><div class="when">'+(region==='tokio'?'5–10 listopada':'11–19 listopada')+'</div><h2>Cała wyprawa</h2><p>Wybierz dzień, żeby zobaczyć trasę i kolejne punkty. Hotel to złota ikonka 🏨.</p></div>';
    R.days.forEach(function(d){html+='<div class="stop" style="--c:'+d.c+'" data-day="'+d.id+'"><div class="num">'+(d.stops.length||'–')+'</div><div><h3>'+esc(d.lbl)+' — '+esc(d.title)+'</h3><p>'+esc(d.desc)+'</p></div></div>'});
  } else {
    var d=list[0];
    html+='<div class="dayhead" style="--c:'+d.c+'"><div class="when">'+esc(d.lbl)+'</div><h2>'+esc(d.title)+'</h2><p>'+esc(d.desc)+'</p></div><ol class="stops" style="--c:'+d.c+'">';
    d.stops.forEach(function(s,i){html+='<li class="stop" data-k="'+d.id+'-'+i+'"><div class="num">'+(i+1)+'</div><div><h3>'+(s.t?'<span class="t">'+esc(s.t)+'</span>':'')+esc(s.n)+'</h3><p>'+(s.w?'<span class="who">'+esc(s.w)+'</span>':'')+esc(s.d)+'</p><a class="nav" href="'+gm(s)+'" target="_blank" rel="noopener">nawiguj ↗</a></div></li>'});
    html+='</ol>'+(d.tip?'<div class="tip">'+d.tip+'</div>':'');
  }
  body.innerHTML=html; body.scrollTop=0;
  body.querySelectorAll('[data-day]').forEach(function(el){el.onclick=function(){select(el.dataset.day,true)}});
  body.querySelectorAll('[data-k]').forEach(function(el){
    el.onclick=function(e){if(e.target.closest('a'))return;var m=markers.find(function(x){return x._k===el.dataset.k});if(m){map.flyTo(m.getLatLng(),16,{duration:.9});setTimeout(function(){m.openPopup()},900);if(window.innerWidth<=760){panel.classList.remove('big');}}};
    el.onmouseenter=function(){var m=markers.find(function(x){return x._k===el.dataset.k});if(m&&m._icon)m._icon.firstChild.classList.add('hot')};
    el.onmouseleave=function(){var m=markers.find(function(x){return x._k===el.dataset.k});if(m&&m._icon)m._icon.firstChild.classList.remove('hot')};
  });
  // Google Maps trasa dnia
  var g=document.getElementById('gmaps');
  if(id!=='all' && list[0].stops.length){
    var st=list[0].stops.slice(0,10), o=R.home.ll;
    var url='https://www.google.com/maps/dir/?api=1&origin='+o[0]+','+o[1]+'&destination='+st[st.length-1].ll.join(',')+(st.length>1?'&waypoints='+st.slice(0,-1).map(function(s){return s.ll.join(',')}).join('|'):'')+'&travelmode='+(region==='tokio'?'transit':'driving');
    g.href=url; g.style.display='';
  } else g.style.display='none';
  var pad=window.innerWidth>760?{paddingTopLeft:[440,40],paddingBottomRight:[40,40]}:{paddingTopLeft:[30,30],paddingBottomRight:[30,Math.round(window.innerHeight*.48)]};
  if(fly) map.flyToBounds(L.latLngBounds(bounds),Object.assign({maxZoom:15,duration:1.1},pad));
}

document.querySelectorAll('.region button').forEach(function(b){b.onclick=function(){renderRegion(b.dataset.r)}});

// „Dziś” — dzień wyjazdu odpowiadający dzisiejszej dacie
document.getElementById('today').onclick=function(){
  var t=new Date(),iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  for(var r in D){var d=D[r].days.find(function(x){return x.date===iso&&x.id!=='9f'});if(d){if(region!==r)renderRegion(r);select(d.id,true);return}}
  alertBox('Dziś nie ma dnia w planie — pierwszy dzień wyprawy to 5.11.');
};
function alertBox(msg){var b=document.getElementById('body');var n=document.createElement('div');n.className='tip';n.textContent=msg;b.prepend(n);setTimeout(function(){n.remove()},4000)}

// Mobile: zwijanie panelu
document.getElementById('grab').onclick=function(){panel.classList.toggle('big')};

// KML do Google Moje Mapy
document.getElementById('kml').onclick=function(){
  function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function col(hex){hex=hex.replace('#','');return 'ff'+hex.substr(4,2)+hex.substr(2,2)+hex.substr(0,2)}
  var k='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Wyprawa Tokio + Palau 2026</name>';
  ['tokio','palau'].forEach(function(r){var R=D[r];
    R.days.forEach(function(d){k+='<Style id="s'+d.id+'"><IconStyle><color>'+col(d.c)+'</color><Icon><href>https://maps.google.com/mapfiles/kml/paddle/wht-blank.png</href></Icon></IconStyle></Style>'});
    k+='<Folder><name>'+(r==='tokio'?'Tokio — hotel':'Palau — nocleg')+'</name><Placemark><name>'+x(R.home.n)+'</name><description>'+x(R.home.d)+'</description><Point><coordinates>'+R.home.ll[1]+','+R.home.ll[0]+',0</coordinates></Point></Placemark></Folder>';
    R.days.forEach(function(d){
      if(!d.stops.length) return;
      k+='<Folder><name>'+x(d.lbl+' — '+d.title)+'</name>';
      d.stops.forEach(function(s,i){k+='<Placemark><name>'+(i+1)+'. '+x(s.n)+'</name><description>'+x((s.t?s.t+' · ':'')+(s.w?s.w+' · ':'')+s.d)+'</description><styleUrl>#s'+d.id+'</styleUrl><Point><coordinates>'+s.ll[1]+','+s.ll[0]+',0</coordinates></Point></Placemark>'});
      k+='</Folder>';
    });
  });
  k+='</Document></kml>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([k],{type:'application/vnd.google-earth.kml+xml'}));a.download='wyprawa-tokio-palau.kml';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
};

var startR='tokio'; if(location.hash==='#palau') startR='palau';
renderRegion(startR);
})();
</script>
</body>
</html>
