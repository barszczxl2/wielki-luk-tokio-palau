<div id="wlcd" aria-live="off"></div>
<script>
(function(){
var wlLEGS=[
  {rn:'Warszawa → Tokio',ts:Date.UTC(2026,10,4,21,40)},
  {rn:'Tokio → Koror',ts:Date.UTC(2026,10,11,8,55)},
  {rn:'Koror → Tokio',ts:Date.UTC(2026,10,19,3,0)},
  {rn:'Tokio → Seul',ts:Date.UTC(2026,10,20,3,0)},
  {rn:'Seul → Warszawa',ts:Date.UTC(2026,10,23,0,0)}
];
function wlDniTxt(n){if(n===1)return'1 dzień';var d=n%10,s=n%100;if(d>=2&&d<=4&&!(s>=12&&s<=14))return n+' dni';return n+' dni';}
function wlNextLeg(now){for(var i=0;i<wlLEGS.length;i++){if(wlLEGS[i].ts>now)return i;}return -1;}
var el=document.getElementById('wlcd');
function tick(){
  var now=Date.now(),n=wlNextLeg(now);
  if(n===-1){el.style.display='none';return;}
  var d=wlLEGS[n].ts-now,dni=Math.floor(d/864e5),h=Math.floor(d/36e5)%24,m=Math.floor(d/6e4)%60;
  el.innerHTML=wlLEGS[n].rn+' — odjazd za <b>'+wlDniTxt(dni)+' '+h+' h '+m+' min</b>';
}
tick();setInterval(tick,30000);
})();
</script>
